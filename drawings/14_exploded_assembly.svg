<text x="20.0" y="198.0" font-size="3.2" text-anchor="start" fill="#222" >A. 前面: 背板(スラブ枠一体)へパネルをM3で固定→ガラスをスラブ枠へ全周接着(U22, エアギャップ0.9)。</text>
<text x="20.0" y="205.0" font-size="3.2" text-anchor="start" fill="#222" >B. 背板: 吊りピン×4(M3・肩径Ø5)、ヒンジブロック(貫通M6×4+裏当て鋼板)、接地スタッド。</text>
<text x="20.0" y="212.0" font-size="3.2" text-anchor="start" fill="#222" >C. トレイ(机上): スタンドオフ→基板(ITX4点)→CPU→ポンプ(AM5バックプレート)→DIMM→SSD。</text>
<text x="20.0" y="219.0" font-size="3.2" text-anchor="start" fill="#222" >D. トレイ: ラジエーター(M3×4)→PSU(SFX M3×4)→GPU(クレードル)→ライザー→ファン→ctrl基板。</text>
<text x="20.0" y="226.0" font-size="3.2" text-anchor="start" fill="#222" >E. 配線(W1〜W5)をコーム/タグで固定。通電前にBIOS確認(FlashBack)。</text>
<text x="20.0" y="233.0" font-size="3.2" text-anchor="start" fill="#222" >F. トレイを吊りピンに掛け拘束ネジ×2、アンビリカル/接地編組を接続。ドームは上辺フックに掛け下辺ラッチ6点で固定。</text></svg>
