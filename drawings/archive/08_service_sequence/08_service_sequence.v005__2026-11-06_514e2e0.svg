<text x="26" y="97" font-size="3.1" text-anchor="start" fill="#222">④トレイ拘束ネジ2本 ⑤トレイを12mm持ち上げ背面へ約100mm引く(アンビリカル余長250mm) ⑥アンビリカルを外す(eDP, 12V, USB)・接</text>
