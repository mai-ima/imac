<text x="26" y="145" font-size="3.1" text-anchor="start" fill="#222">⑧GPUクレードルのクランプを開く→ライザーを抜く→GPUを外す ⑨SFX電源のM3×4を外す ⑩AIO: ラジエーターのスタンドオフ4本、ポンプのAM5ば</text>
