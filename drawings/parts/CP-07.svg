<text x="156" y="49.80000000000001" font-size="2.6">要素: 縁の内奥行6mm→内面最大101mm(smoothstep, run 64mm)、外面最大総厚はスラブ2</text>
<text x="156" y="54.000000000000014" font-size="2.6">5+104=129</text>
<text x="156" y="59.20000000000002" font-size="2.6">要素: 全面均一パーフォレーション Ø2.4×ピッチ4.0 千鳥(縁から36mm内側)</text>
<text x="156" y="64.40000000000002" font-size="2.6">要素: 上辺フック×6 / 下辺ラッチ穴×6(下面向き凹み) / 位置決めピン穴Ø4×2 / 磁石ポケット×12</text>
<text x="156" y="69.60000000000002" font-size="2.6">要素: EMIガスケット溝(幅3.0×深さ1.5, 周長約1947mm)</text>
<text x="156" y="74.80000000000003" font-size="2.6">要素: 下辺傾斜面の開口: I/Oスロット120×22 / GPU出力スロット142×20 / ACインレット3</text>
<text x="156" y="79.00000000000003" font-size="2.6">2×26 / 電源ボタン</text>
<text x="156" y="84.20000000000003" font-size="2.6">要素: RF窓: 上辺の浅い位置に平板(60×30)を取付(傾斜面を避ける)</text>
<text x="156" y="89.40000000000003" font-size="2.6">要素: 内側に黒メッシュフィルタ(ドーム内面追従の殻, 磁石保持)</text>
