<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="sans-serif">
  <rect width="900" height="560" fill="#f4f4f6"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" fill="#222">iMac風 一体型ゲーミングPC — コンセプト</text>
  <!-- 正面 -->
  <g transform="translate(40,60)">
    <rect x="0" y="0" width="400" height="260" rx="10" fill="#d9dbde"/>
    <rect x="9" y="9" width="382" height="205" fill="#0b0b0d"/>
    <rect x="9" y="9" width="382" height="205" fill="url(#g)" opacity=".5"/>
    <circle cx="200" cy="237" r="3" fill="#888"/>
    <rect x="150" y="3" width="100" height="3" rx="1.5" fill="#444"/>
    <path d="M170 300 h60 v-40 h-60z" fill="#c9ccd0"/>
    <rect x="130" y="300" width="140" height="8" rx="3" fill="#c9ccd0"/>
    <text x="200" y="335" text-anchor="middle" font-size="13" fill="#444">正面 (27インチ 4K / 薄型チン)</text>
  </g>
  <!-- 側面 -->
  <g transform="translate(520,60)">
    <rect x="0" y="0" width="14" height="260" rx="3" fill="#d9dbde"/>
    <rect x="14" y="125" width="46" height="135" rx="5" fill="#c9ccd0"/>
    <text x="0" y="-8" font-size="12" fill="#444">側面: 前面スラブ14mm + 背面ポッド(合計46mm)</text>
    <text x="0" y="300" font-size="12" fill="#444">下部スリットから吸気 → 上部から排気</text>
  </g>
  <!-- 内部 -->
  <g transform="translate(40,380)" font-size="12" fill="#222">
    <rect x="0" y="0" width="820" height="150" rx="8" fill="#fff" stroke="#bbb"/>
    <rect x="20" y="20" width="170" height="110" fill="#e8f0ff" stroke="#678"/><text x="105" y="80" text-anchor="middle">Mini-ITX基板(APU)</text>
    <rect x="210" y="20" width="150" height="110" fill="#ffe8e0" stroke="#876"/><text x="285" y="80" text-anchor="middle">ヒートパイプ+大型フィン</text>
    <circle cx="430" cy="75" r="50" fill="#eef" stroke="#678"/><text x="430" y="79" text-anchor="middle">120mmファン</text>
    <rect x="510" y="20" width="140" height="110" fill="#eef8e8" stroke="#687"/><text x="580" y="80" text-anchor="middle">電源 / DC入力</text>
    <rect x="670" y="20" width="130" height="110" fill="#f0f0f0" stroke="#999"/><text x="735" y="80" text-anchor="middle">I/Oポート(背面)</text>
  </g>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a6cf7"/><stop offset="1" stop-color="#e86aa6"/></linearGradient></defs>
</svg>
